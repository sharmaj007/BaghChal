name: iOS & Android Cloud Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App (APK & AAB Bundle)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Android Debug APK & AAB Bundle
        run: |
          ./gradlew app:assembleDebug
          ./gradlew app:bundleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bagh-chal-android-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Android AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bagh-chal-android-aab-bundle
          path: app/build/outputs/bundle/debug/*.aab

  build-ios:
    name: Build iOS Package (.ipa & KMP Source)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile Native iOS App Executable with xcodebuild
        run: |
          cd iosApp
          xcodebuild -project BaghChal.xcodeproj -scheme BaghChal -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build/
          mkdir -p ../ipa_export/Payload
          cp -r build/Build/Products/Release-iphoneos/BaghChal.app ../ipa_export/Payload/

      - name: Package Sideloadly .ipa File
        run: |
          cd ipa_export
          zip -r BaghChal.ipa Payload

      - name: Package iOS Source Files
        run: |
          mkdir -p ios_export
          cp -r iosApp/* ios_export/
          cp -r app/src/main/java/com/games/baghchal/engine ios_export/
          cp -r app/src/main/java/com/games/baghchal/ui ios_export/

      - name: Upload iOS Sideloadly IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bagh-chal-ios-sideloadly-ipa
          path: ipa_export/BaghChal.ipa

      - name: Upload iOS Source Package
        uses: actions/upload-artifact@v4
        with:
          name: bagh-chal-ios-source-package
          path: ios_export/
