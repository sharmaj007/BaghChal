name: iOS & Android Cloud Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App (APK & AAB Bundle)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Android Debug APK & AAB Bundle
        run: |
          ./gradlew app:assembleDebug
          ./gradlew app:bundleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bagh-chal-android-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Android AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bagh-chal-android-aab-bundle
          path: app/build/outputs/bundle/debug/*.aab

  build-ios:
    name: Build iOS Package
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Kotlin Multiplatform Engine for iOS
        run: |
          mkdir -p ios_framework
          cp -r app/src/main/java/com/games/baghchal/engine ios_framework/
          cp -r app/src/main/java/com/games/baghchal/ui ios_framework/

      - name: Upload iOS Kotlin Multiplatform Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bagh-chal-ios-kmp-source
          path: ios_framework/
