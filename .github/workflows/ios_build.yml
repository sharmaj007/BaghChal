name: iOS & Android Cloud Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS & Android Apps
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew app:assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bagh-chal-android-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Kotlin Multiplatform iOS Framework
        run: ./gradlew :app:linkReleaseFrameworkIosArm64 || ./gradlew :app:assembleDebug

      - name: Upload iOS Framework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bagh-chal-ios-framework
          path: app/build/bin/iosArm64/releaseFramework/*
          if-no-files-found: ignore
